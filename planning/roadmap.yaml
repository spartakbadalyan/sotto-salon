  verification:
    planned:
    - Acceptance walkthrough for SAL-007 with recorded results
    - Relevant negative-path integration tests using lawful synthetic fixtures
    evidence:
    - '2026-09-12 AC01: CPython 3.14.3 venv; pip install -e ".[dev]" resolved fastapi 0.141.1,
      pydantic 2.13.5, SQLAlchemy 2.0.52, alembic 1.20.0, psycopg 3.x, uvicorn; exact versions
      frozen in backend/requirements.lock.'
    - '2026-09-12 AC01: uvicorn salon.api.main:app served GET /health/live -> {"status":"ok"},
      GET /api/v1/meta -> name/version/environment/adapters with no secret fields, GET /openapi.json
      title "Sotto Salon API". apps/web npm run build (Next.js 15.5.25) compiled and type-checked
      4 routes; the home page calls /api/v1/meta over the configured base URL.'
    - '2026-09-12 AC02: alembic -x db_url=sqlite upgrade head then downgrade base on an empty
      database created and removed system_metadata (opaque string id, timezone-aware UTC timestamps),
      leaving only alembic_version. export_openapi.py output was byte-identical on repeat runs;
      contracts npm run generate (openapi-typescript 7.13.0) + npm run check (tsc) clean.'
    - '2026-09-12 AC03: pytest test_missing_settings_raise_redacted_diagnostics -> ConfigurationError
      names SALON_DATABASE_URL as missing but a provided secret value never appears in the message.'
    - '2026-09-12 AC04: pytest -> production Settings reject synthetic verification/payment adapters
      and allow_auth_bypass; assert_adapters_allowed() fails closed as defence in depth; development
      accepts synthetic. Full suite 24 passed; ruff check clean.'
    - '2026-09-13 Codex review fixes verified: load_settings() reads a local .env in development
      (confirmed) and ignores it in production (confirmed ConfigurationError); CORSMiddleware echoes
      an allowed web origin (http://localhost:3000) and omits the header for an unknown origin, both
      checked against a live server and locked by tests; the two readiness tests now mock the DB
      engine so 503/200 are deterministic regardless of a local Postgres.'
  implementation:
    pull_request: null
    commits: []
    notes:
    - Implemented on branch feature/restore-planning-and-scr007. Not committed or pushed; awaiting
      explicit authorization per tracking policy.
    - 'Stack pinned per architecture: FastAPI/pydantic/SQLAlchemy/alembic/psycopg backend, Next.js/React/TypeScript
      web, generated OpenAPI contract types. The nine+ domain packages (identity, verification,
      countries, access, profiles, media, moderation, directory, billing, compliance, operations)
      are empty bounded-context placeholders with no business logic.'
    - 'Synthetic-only: production refuses synthetic verification/payment adapters and auth bypass
      (salon.core.config model validator + salon.core.adapters runtime guard). No real identities,
      payments, or customer data.'
    - 'Robustness: the database engine uses a bounded connect_timeout so /health/ready fails fast
      instead of hanging when Postgres is unreachable.'
    - 'Codex review (2026-09-13) addressed: (P1) .env is now loaded outside production so the
      documented cp .env.example .env flow works, while production still ignores dotenv files;
      (P1) CORSMiddleware allows the configured web origin(s) (SALON_CORS_ALLOWED_ORIGINS,
      default localhost/127.0.0.1:3000) so the browser client can call the API; (P2) readiness
      tests mock the DB engine instead of depending on whether a local Postgres is running.'
    - 'Codex re-review (2026-09-13) addressed: (P1) SALON_CORS_ALLOWED_ORIGINS is annotated NoDecode
      so a comma-separated dotenv value no longer raises SettingsError before validation (the .env
      startup flow now works); a test loads the values through the real settings source rather than
      the direct constructor. (P2) database_url normalizes a bare postgresql://forms to
      postgresql+psycopg:// (psycopg 3 is the only installed driver) and rejects an explicit
      unsupported driver at config validation, so app and migration engines cannot fall back to the
      absent psycopg2.'
    - 'Codex third review (2026-09-13) addressed: (P2) the database-driver rejection now uses a
      fixed error message and never interpolates the input DSN, so a malformed URL carrying a
      password cannot leak into the redacted configuration diagnostics (regression test added);
      (P2) ESLint is configured via a flat config bridging next/core-web-vitals and the lint script
      runs "eslint ." non-interactively (exit 0, clean) instead of opening Next.js interactive setup.'
    - 'Codex fourth review (2026-09-13) addressed: (P2) load_settings() now rejects production when
      it is resolved through a dotenv file (SALON_ENVIRONMENT=production set in .env rather than the
      process environment), so production can never draw its database credentials or session secret
      from a dotenv file; production set in the real process environment is still accepted. Regression
      tests cover both paths and confirm no dotenv secret leaks into the diagnostic.'
