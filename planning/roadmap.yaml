schema_version: 1
project: Sotto Salon
scope: Subscription-funded adult profile advertising; one-territory pilot then gated expansion
architecture_file: docs/architecture/mvp-architecture.md
product_file: docs/product/mvp.md
tracking_guide: planning/README.md
allowed_statuses:
- planned
- in_progress
- blocked
- in_review
- done
- cancelled
allowed_file_actions:
- create
- modify
- delete
priorities:
  P0: Required for first paid pilot
  P1: Optional independent territory expansion
tracking_policy:
  paths: Workspace-relative; proposed files may not exist yet
  actual_changes: Record exact files after implementation
  verification: Record actual results, not planned test names
  commits: No commit or push authorized by this backlog
  completion: Requirements documents do not constitute completed implementation
  decisions: Open decisions block the live activity in blocks; synthetic work can proceed
decisions:
- id: ARC-001
  title: Pilot entity and jurisdiction
  status: open
  proposed_default: Belgium first candidate; disabled until reviewed
  blocks: Real onboarding and first-territory launch
- id: ARC-002
  title: Legal applicability and sensitive-data design
  status: open
  proposed_default: Article-level DSA register, DPIA and reviewed disclosure/billing terms
  blocks: Real personal-data processing and public advertising
- id: ARC-003
  title: Identity and age provider
  status: open
  proposed_default: Evaluate Yoti; exact-model acceptance required
  blocks: Live advertiser KYC and visitor age processing
- id: ARC-004
  title: Subscription acquiring
  status: open
  proposed_default: Evaluate CCBill and alternatives; none approved yet
  blocks: Live subscription collection
- id: ARC-005
  title: Hosting and supporting services
  status: open
  proposed_default: Evaluate Infomaniak and Leaseweb; service-specific acceptance
  blocks: Cloud procurement and live hosting/data processing
- id: ARC-006
  title: Retention and recovery policy
  status: open
  proposed_default: Data-class schedule; proposed RPO 24h and RTO 8h
  blocks: Production retention, backups and restoration
- id: ARC-007
  title: Content policy and moderation capacity
  status: open
  proposed_default: Non-explicit self-ads; human review and urgent rota
  blocks: Real uploads and publication
- id: ARC-008
  title: Price, tax and renewal policy
  status: open
  proposed_default: One fixed monthly plan; price and terms unresolved
  blocks: Live price offers and recurring billing
- id: ARC-009
  title: Netherlands expansion eligibility
  status: open
  proposed_default: Independent local legal/provider/operations review
  blocks: Netherlands territory activation
- id: ARC-010
  title: Switzerland expansion eligibility
  status: open
  proposed_default: Independent canton/locality legal/provider/operations review
  blocks: Switzerland territory activation
release_gates:
  synthetic_staging:
    decisions: []
    stories:
    - SAL-007
    - SAL-008
    - SAL-009
    approvals:
    - Engineering review of synthetic-only deployment
    note: No customer IDs, content or real charges
  paid_pilot:
    decisions:
    - ARC-001
    - ARC-002
    - ARC-003
    - ARC-004
    - ARC-005
    - ARC-006
    - ARC-007
    - ARC-008
    stories:
    - SAL-029
    approvals:
    - Country legal review accepted
    - Exact-model provider contracts approved
    - Privacy/security assessments accepted
    - Moderation and support coverage staffed
    - Accountable operator release approval
    note: All transitive dependencies done; decisions approved for pilot scope
  pilot_review:
    decisions: []
    stories:
    - SAL-030
    approvals:
    - Recorded continue narrow or stop decision
    note: Observation occurs after launch
  netherlands:
    decisions:
    - ARC-009
    stories:
    - SAL-031
    approvals:
    - Dutch territory launch with renewed provider/operations evidence
    note: Depends on pilot review; does not require Switzerland
  switzerland:
    decisions:
    - ARC-010
    stories:
    - SAL-032
    approvals:
    - Swiss locality launch with renewed provider/operations evidence
    note: Depends on pilot review; does not require Netherlands
