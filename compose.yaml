# Disposable local development stack for Sotto Salon.
#
# These are LOCAL STAND-INS for development only, not the managed production services:
#   - postgres : application database
#   - minio    : S3-compatible object storage stand-in (private media quarantine, later stories)
#   - redis    : queue / outbox transport stand-in
#
# All ports bind to 127.0.0.1 so nothing is exposed on the network. Reset everything with
#   docker compose -p sotto-salon down -v
# No real customer data, identity documents, or payment credentials belong here.

name: sotto-salon

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: salon
      POSTGRES_DB: salon
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sotto-salon-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon -d salon"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: salon-dev
      MINIO_ROOT_PASSWORD: salon-dev-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - sotto-salon-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - sotto-salon-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sotto-salon-pgdata:
  sotto-salon-minio:
  sotto-salon-redis:
